mark_taken:
  name: Mark Taken
  description: Record that a medication dose was taken.
  target:
    entity:
      domain: sensor
      integration: medication_reminder
  fields: {}

mark_skipped:
  name: Mark Skipped
  description: Record that a medication dose was skipped.
  target:
    entity:
      domain: sensor
      integration: medication_reminder
  fields: {}

mark_snoozed:
  name: Snooze Reminder
  description: Snooze the medication reminder for a set number of minutes.
  target:
    entity:
      domain: sensor
      integration: medication_reminder
  fields:
    minutes:
      name: Minutes
      description: How many minutes to snooze. Defaults to the medication's configured snooze duration (1–1440).
      required: false
      example: 15
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min

mark_pending:
  name: Reset to Pending
  description: Reset a medication's state back to Pending.
  target:
    entity:
      domain: sensor
      integration: medication_reminder
  fields: {}

refill_set:
  name: Set Refill Count
  description: Set or update the refill tracking values for a medication.
  target:
    entity:
      domain: sensor
      integration: medication_reminder
  fields:
    remaining:
      name: Remaining Doses
      description: Number of doses currently remaining.
      required: false
      example: 90
      selector:
        number:
          min: 0
          max: 9999
    threshold:
      name: Low Supply Threshold
      description: Alert when remaining doses fall at or below this number.
      required: false
      example: 14
      selector:
        number:
          min: 0
          max: 9999
    units_per_intake:
      name: Units Per Dose
      description: How many units (pills/ml) are consumed per dose.
      required: false
      example: 1
      selector:
        number:
          min: 1
          max: 100

refill_add:
  name: Add Refill
  description: Add doses to the refill count (e.g. after a pharmacy pickup).
  target:
    entity:
      domain: sensor
      integration: medication_reminder
  fields:
    amount:
      name: Amount
      description: Number of doses to add.
      required: true
      example: 90
      selector:
        number:
          min: 1
          max: 9999

refill_acknowledge:
  name: Acknowledge Refill Alert
  description: Clear the low-supply alert flag so notifications stop until the next threshold crossing.
  target:
    entity:
      domain: sensor
      integration: medication_reminder
  fields: {}
